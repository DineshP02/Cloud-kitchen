<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu | Bowl & Hearth</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script><link rel="stylesheet" href="../css/style.css"></head><body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100"><div id="site-header"></div><main><section class="mx-auto max-w-7xl px-5 py-16 sm:px-8 lg:px-12"><p class="eyebrow">Today's menu</p><h1 class="section-title text-5xl sm:text-6xl">Choose by time. Then choose your flavour.</h1><div class="mt-8 flex flex-wrap gap-2" id="filters"><button data-filter="all" class="filter-btn active">All</button><button data-filter="breakfast" class="filter-btn">Breakfast</button><button data-filter="lunch" class="filter-btn">Lunch</button><button data-filter="dinner" class="filter-btn">Dinner</button><button data-filter="snacks" class="filter-btn">Snacks</button></div><div id="menu-grid" class="mt-10 grid gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-3"></div></section></main><div id="site-footer"></div><script src="../js/components.js"></script><script src="../js/main.js"></script><script>const dishes=[['breakfast','South Indian','Ghee Podi Idli','₹129','https://images.unsplash.com/photo-1589301760014-d929f3979dbc?auto=format&fit=crop&w=800&q=80'],['breakfast','Healthy','Banana Peanut Oats','₹139','https://images.unsplash.com/photo-1517673400267-0251440c45dc?auto=format&fit=crop&w=800&q=80'],['lunch','Indian','Paneer Lunch Bowl','₹189','https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=800&q=80'],['lunch','Rice Bowls','Pepper Chicken Rice','₹229','https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=800&q=80'],['dinner','Comfort','Creamy Tomato Pasta','₹219','https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=800&q=80'],['dinner','Indian','Coconut Veg Curry','₹199','https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80'],['snacks','Street Food','Crispy Paneer Wrap','₹159','https://images.unsplash.com/photo-1529006557810-274b9b2fc783?auto=format&fit=crop&w=800&q=80'],['snacks','Bites','Masala Corn Cups','₹99','https://images.unsplash.com/photo-1551754655-cd27e38d2076?auto=format&fit=crop&w=800&q=80']];function renderMenu(f='all'){document.querySelector('#menu-grid').innerHTML=dishes.filter(d=>f==='all'||d[0]===f).map(d=>`<article class="overflow-hidden rounded-3xl bg-white shadow-sm dark:bg-stone-900"><img class="h-60 w-full object-cover" src="${d[4]}" alt="${d[2]}" loading="lazy"><div class="p-5"><div class="flex justify-between gap-3"><span class="text-xs font-bold uppercase tracking-widest text-amber-600">${d[1]}</span><b>${d[3]}</b></div><h2 class="mt-3 text-xl font-bold">${d[2]}</h2><p class="mt-2 text-sm text-stone-500">Freshly prepared to order with locally sourced ingredients where possible.</p></div></article>`).join('')}renderMenu();document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.filter){document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');renderMenu(e.target.dataset.filter)}})</script></body></html>
