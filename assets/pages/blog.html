<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal | Bowl & Hearth</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../css/style.css"></head><body class="bg-stone-50"><div id="site-header"></div><main class="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-12"><p class="eyebrow">Kitchen journal</p><h1 class="section-title">Useful food stories.</h1><input id="search" class="form-input mt-8 max-w-md" placeholder="Search articles..."><div id="posts" class="mt-10 grid gap-6 md:grid-cols-3"></div></main><div id="site-footer"></div><script src="../js/components.js"></script><script src="../js/main.js"></script><script>const posts=[['Why cloud kitchens can cook better','A focused kitchen can spend more attention on prep, consistency and delivery.'],['How to plan an office lunch','A practical guide to headcounts, menu balance and delivery windows.'],['Building a better snack table','Small bites can make a gathering feel generous without becoming complicated.']];function draw(q=''){posts.filter(p=>p.join(' ').toLowerCase().includes(q.toLowerCase())).forEach}document.querySelector('#posts').innerHTML=posts.map((p,i)=>`<a href="blog-details.html" class="rounded-3xl bg-white p-7 shadow-sm"><span class="text-xs font-bold uppercase tracking-widest text-amber-600">Journal 0${i+1}</span><h2 class="mt-5 text-2xl font-bold">${p[0]}</h2><p class="mt-3 text-sm text-stone-500">${p[1]}</p><span class="mt-8 inline-block font-bold">Read article →</span></a>`).join('');document.querySelector('#search').addEventListener('input',e=>document.querySelectorAll('#posts>a').forEach((x,i)=>x.style.display=posts[i].join(' ').toLowerCase().includes(e.target.value.toLowerCase())?'block':'none'))</script></body></html>
